version: '3.8'

services:
  # ── PostgreSQL Database Container ────────────────
  db:
    image: postgres:16-alpine
    container_name: moneymanager-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymanager_secure_pwd_2026}
      POSTGRES_DB: ${POSTGRES_DB:-money_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneymanager} -d ${POSTGRES_DB:-money_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Next.js 16 Web Application Container ──────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneymanager-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-moneymanager}:${POSTGRES_PASSWORD:-moneymanager_secure_pwd_2026}@db:5432/${POSTGRES_DB:-money_manager}?schema=public
      - SESSION_SECRET=${SESSION_SECRET:-money-mgmt-session-secret-change-in-prod-32bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-money-mgmt-enc-key-change-in-prod-32bytes}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "80:3001"

volumes:
  postgres_data:
    driver: local
